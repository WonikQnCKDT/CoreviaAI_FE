name: CoreviaAI_FE_Develop_CI

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write  # 테스트 커버리지 작성

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types
        run: npm run type-check

      - name: Run unit and integration tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Lint frontend source
        run: npm run lint

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag webui-be:${{ github.sha }} .
