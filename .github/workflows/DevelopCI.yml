name: CoreviaAI_FE_Develop_CI

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write  # 테스트 커버리지 PR 코멘트 작성

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run tests with coverage
        id: coverage
        run: npm run test:coverage

      - name: Vitest Coverage Report to PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') && github.event_name == 'pull_request'
        with:
          name: CoreviaAI_FE Test Coverage
          vite-config-path: ./vitest.config.ts
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          file-coverage-mode: changes

      - name: Build frontend
        run: npm run build

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile not found. Skipping Docker build."
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: corevia-fe:${{ github.sha }}
