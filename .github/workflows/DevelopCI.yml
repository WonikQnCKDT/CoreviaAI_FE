name: CoreviaAI_FE_Develop_CI

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write  # 테스트 커버리지 작성

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AuthServerPlatform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify formatting, static analysis, tests, and build
        run: ./gradlew clean check bootJar --no-daemon

      - name: Jacoco Report to PR
        uses: madrapps/jacoco-report@v1.7.1
        if: github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/AuthServerPlatform/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-default: 60
          title: "CoreviaAI_FE Test Coverage"

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag webui-be:${{ github.sha }} .
